name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    # --- FULL VERSION (WITH DATA) ---
    - name: Build Windows App (With Data)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build:win

    - name: Upload Installer (With Data)
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Setup-With-Data
        path: "build/Mersal Info Center Setup*.exe"

    # --- EMPTY VERSION (NO DATA) ---
    - name: Wipe Database for Empty Build
      shell: bash
      run: |
        rm -f mersal.db
        node -e "require('better-sqlite3')('mersal.db').close()"

    - name: Build Windows App (Empty)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build:win

    - name: Upload Installer (Empty)
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Setup-Empty
        path: "build/Mersal Info Center Setup*.exe"

    # Upload the portable folder of the empty version just in case
    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Portable
        path: build/win-unpacked/
