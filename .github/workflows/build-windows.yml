name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Windows App
      run: npm run build:win > build-log.txt 2>&1 || exit 1
      shell: bash

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-log.txt

    - name: Upload Build Log as Commit
      if: always()
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add build-log.txt
        git commit -m "ci: append build log" || echo "No changes"
        git push || echo "Push failed"
      shell: bash

    # Upload the NSIS installer (single .exe that includes everything)
    - name: Upload Installer
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Setup
        path: "build/Mersal Info Center Setup*.exe"

    # Also upload the full portable folder (in case installer isn't generated)
    - name: Upload Portable
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Portable
        path: build/win-unpacked/
