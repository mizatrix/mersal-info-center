name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Windows App
      run: npm run build:win

    # Upload the NSIS installer (single .exe that includes everything)
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Setup
        path: build/Mersal Info Center Setup*.exe

    # Also upload the full portable folder (in case installer isn't generated)
    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Portable
        path: build/win-unpacked/
