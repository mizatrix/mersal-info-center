name: Build Windows Installer (with Data)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code (with LFS)
      uses: actions/checkout@v4
      with:
        lfs: true          # ← pulls the 276 MB mersal.db from Git LFS

    - name: Verify database exists
      shell: bash
      run: |
        echo "=== Checking mersal.db ==="
        ls -lh mersal.db
        file mersal.db
        DB_SIZE=$(stat --printf="%s" mersal.db)
        echo "Database size: $DB_SIZE bytes"
        if [ "$DB_SIZE" -lt 1000000 ]; then
          echo "❌ ERROR: mersal.db is too small ($DB_SIZE bytes) — LFS pull likely failed!"
          echo "   This is probably just an LFS pointer file, not the real database."
          exit 1
        fi
        echo "✅ Database looks good ($(($DB_SIZE / 1024 / 1024)) MB)"

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Build Windows installer + portable
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build:win

    - name: List build output
      shell: bash
      run: |
        echo "=== Build output ==="
        ls -lh build/ || true
        echo "=== Setup files ==="
        ls -lh build/*.exe 2>/dev/null || echo "No exe files found"
        echo "=== Portable ==="
        ls -lh build/win-unpacked/ 2>/dev/null | head -20 || echo "No portable folder"

    # ── Upload the NSIS installer (one-click setup EXE with data) ──
    - name: Upload Installer (with Data)
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Installer
        path: |
          build/Mersal Info Center Setup*.exe
        if-no-files-found: error
        compression-level: 1   # already compressed by NSIS

    # ── Upload the portable version (no install needed) ──
    - name: Upload Portable (with Data)
      uses: actions/upload-artifact@v4
      with:
        name: Mersal-Info-Center-Portable
        path: build/win-unpacked/
        if-no-files-found: error
        compression-level: 1
