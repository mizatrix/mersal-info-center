name: Cleanup Failed Runs
on: [push]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/actions/runs --paginate -q '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id'); do
            echo "Deleting run $id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$id || true
          done
